# pnpm 11 movio sus settings fuera de .npmrc hacia este archivo.
# El .npmrc de al lado cubre pnpm 10 (la version que corre hoy en Hostinger);
# esta entrada cubre pnpm 11+ por si la plataforma actualiza. Ver .npmrc para el motivo.
nodeLinker: hoisted

# Fijaciones de seguridad de dependencias transitivas (#773).
#
# Antes vivian en `overrides` de package.json, que es sintaxis de NPM: pnpm la ignora, asi
# que produccion nunca las aplico (p. ej. corria axios 1.13.6 con el override pidiendo
# 1.20.0). pnpm 10 las lee de aqui.
#
# Forma «paquete@<X: ^X»: solo SUBE lo que esta por debajo del parche (a X o un parche mas
# nuevo de la misma mayor), nunca baja una version mas nueva que ya estuviera resuelta.
# Las acotadas por mayor (>=4 <4.0.4) evitan arrastrar una mayor vieja a la nueva. `next>postcss` aplica solo al postcss interno de Next.
#
# Para agregar una: poner el piso con el aviso de seguridad a la vista, correr
# `npx pnpm@10.32.1 install` y commitear pnpm-lock.yaml. La CI instala con --frozen-lockfile:
# si el lock no refleja estos overrides, falla.
overrides:
  '@auth/core': 0.41.3
  axios@<1.20.0: ^1.20.0
  browserslist@<4.28.7: ^4.28.7
  deepmerge-ts@<8.0.0: ^8.0.0
  defu@<6.1.5: ^6.1.5
  flatted@<3.4.2: ^3.4.2
  js-yaml@>=4.0.0 <4.3.2: ^4.3.2
  nanoid@<3.3.19: ^3.3.19
  next>postcss: ^8.5.28
  picomatch@<2.3.2: ^2.3.2
  picomatch@>=4.0.0 <4.0.4: ^4.0.4
  brace-expansion@<1.1.20: ^1.1.20
  brace-expansion@>=2.0.0 <2.1.6: ^2.1.6
  follow-redirects@>=1.16.0 <1.16.1: ^1.16.1
  source-map-js@<1.2.2: ^1.2.2
  # Solo herramientas de prueba (vitest 4 usa vite 7).
  vite@>=7.0.0 <7.3.7: ^7.3.7
